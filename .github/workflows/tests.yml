# Run the simulations in run/ which have a reference log (run/<case>.ref)
# against the latest upstream Basilisk, one parallel job per case.
#
# Cases which need OpenSMOKE or Cantera are skipped. Cases which already
# passed with identical inputs (sources, included headers, .ref,
# Makefile, Basilisk version) are not run again: see
# .github/scripts/select-cases.sh. Use "Run workflow" with "force" to
# run everything.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: Run all the cases, even those which are up to date
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  BASILISK_URL: https://basilisk.fr/basilisk/basilisk.tar.gz

jobs:
  basilisk:
    name: build basilisk
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@v4

      # Only the headers are fetched here (basilisk.fr is slow from GitHub):
      # the tarball is downloaded only when it changed since the cached build.
      - name: Check basilisk version
        id: version
        run: |
          stamp=$(curl -sSfIL "$BASILISK_URL" | grep -i '^last-modified:' | tail -1 \
                  | cut -d' ' -f2- | tr -cd '[:alnum:]')
          echo "stamp=${stamp:-$(date +%Y%W)}" >> "$GITHUB_OUTPUT"
          echo "basilisk.tar.gz: ${stamp:-unknown}"

      - name: Cache basilisk build
        id: cache
        uses: actions/cache@v4
        with:
          path: basilisk-build.tar
          key: basilisk-${{ runner.os }}-${{ steps.version.outputs.stamp }}

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgsl-dev gawk

      - name: Build basilisk
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "$BASILISK_URL" -o basilisk.tar.gz
          # qcc embeds the BASILISK path: build where the tests will run
          tar xzf basilisk.tar.gz -C "$HOME"
          cd "$HOME/basilisk/src"
          ln -s config.gcc config
          export BASILISK=$PWD PATH=$PATH:$PWD
          # see https://basilisk.fr/src/INSTALL (serial: the build is order-dependent)
          make -k || true
          make qcc
          make -k || true
          ./qcc --version
          ls -l gl/libfb_tiny.a gl/libglutils.a
          tar cf "$GITHUB_WORKSPACE/basilisk-build.tar" -C "$HOME" basilisk

      - name: Select cases
        id: cases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAMP: ${{ steps.version.outputs.stamp }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          test -d "$HOME/basilisk" || tar xf basilisk-build.tar -C "$HOME"
          export BASILISK=$HOME/basilisk/src PATH=$PATH:$HOME/basilisk/src
          export BASILISK_INCLUDES=-I$GITHUB_WORKSPACE/src BASILISK_LIBS=
          json=$(bash .github/scripts/select-cases.sh)
          echo "cases=$json" >> "$GITHUB_OUTPUT"
          echo "$json"

      - uses: actions/upload-artifact@v4
        if: steps.cases.outputs.cases != '[]'
        with:
          name: basilisk
          path: basilisk-build.tar
          retention-days: 1

  test:
    name: ${{ matrix.case }}
    needs: basilisk
    if: needs.basilisk.outputs.cases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.basilisk.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: basilisk

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgsl-dev gawk

      - name: Set up environment
        run: |
          tar xf basilisk-build.tar -C "$HOME"
          echo "BASILISK=$HOME/basilisk/src" >> "$GITHUB_ENV"
          echo "$HOME/basilisk/src" >> "$GITHUB_PATH"
          echo "BASILISK_INCLUDES=-I$GITHUB_WORKSPACE/src" >> "$GITHUB_ENV"
          echo "BASILISK_LIBS=" >> "$GITHUB_ENV"
          # Movies are not checked: a dummy ffmpeg discards the frames and
          # creates an empty output file (its last argument), as expected by
          # $BASILISK/ppm2mp4 (a missing ffmpeg would print a warning in the
          # log and break the comparison with the .ref file).
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/ffmpeg" <<'EOF'
          #!/bin/sh
          for a; do out=$a; done
          case " $* " in *" -i - "*) cat > /dev/null ;; esac
          : > "$out"
          EOF
          chmod +x "$RUNNER_TEMP/bin/ffmpeg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run ${{ matrix.case }}
        working-directory: run
        run: make -j"$(nproc)" ${{ matrix.case }}.tst

      - name: Show the diff in the summary
        if: failure()
        working-directory: run
        run: |
          {
            echo "### ${{ matrix.case }}"
            echo '```diff'
            cat ${{ matrix.case }}*/fail 2> /dev/null | head -300
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Records that this case passed with these inputs (see select-cases.sh)
      - name: Record pass
        run: |
          mkdir -p pass
          echo "${{ github.sha }}" > pass/${{ matrix.case }}

      - uses: actions/cache/save@v4
        with:
          path: pass
          key: ${{ matrix.key }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.case }}
          path: |
            run/${{ matrix.case }}*/log
            run/${{ matrix.case }}*/out
            run/${{ matrix.case }}*/fail
            run/${{ matrix.case }}*.log~
          if-no-files-found: ignore
          retention-days: 7
